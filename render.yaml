# Render Blueprint for the QuickKart backend API.
# Deploy: Render Dashboard → New → Blueprint → connect this repo.
# The frontend deploys separately on Vercel (see DEPLOYMENT.md).
services:
  - type: web
    name: quickkart-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ENABLE_CRON
        value: "false"
      # Secrets — set these in the Render dashboard (sync:false keeps them out of git):
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_ORIGINS
        sync: false
      - key: REDIS_URL
        sync: false
